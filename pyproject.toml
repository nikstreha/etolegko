[project]
name = "kdfjjj11"
version = "0.1.0"
description = "Async command-line download speed measurement"
readme = "README.md"
authors = [
    { name = "nikstreha", email = "nikstreha@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1,<1.0",
    "rich>=14.0.0",
    "typer>=0.27.3,<1.0",
]

[project.scripts]
kdfjjj11 = "kdfjjj11.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
